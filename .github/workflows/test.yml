name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax prüfen
        run: node --check app.js && node --check data.js && node --check sw.js
      - name: Playwright installieren
        run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Server starten
        run: python3 -m http.server 8765 >/dev/null 2>&1 &
      - name: Rauchtest
        run: sleep 1 && node tests/smoke.mjs
      - name: Online-Test (zwei Spieler, Uhrversatz, Verbindungsabbruch)
        run: node tests/online.mjs
